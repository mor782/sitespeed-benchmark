<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <title>
        Website Performance Dashboard
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Website Preformance Testing</h1>
    <label for="urlInput">Website URL to add</label>
    <input type="text" id="urlInput" placeholder="e.g. https://example.com">
    <button id="addButton" type="button">Add</button>
    <ul id="urlList"></ul>

    <button id="runButton" type="button">Run Tests</button>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>URL</th>
                <th>TTFB</th>
                <th>LCP</th>
                <th>Total Time</th>
            </tr>
        </thead>
        <tbody id="resultsBody" aria-live="polite"></tbody>
    </table>

    <canvas id="comparisonChart" role="img" aria-label="Bar chart comparing website performance"></canvas>
    <h2>History</h2>
    <label for="historySelect">Select a website to view history</label>
    <select id="historySelect"></select>
    <canvas id="historyChart" role="img" aria-label="Line chart showing performance trend over time"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>

</html>
